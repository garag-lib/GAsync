name: PHP compatibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        driver: [GStream, GEV, GEVENT]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: gasync
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      GASYNC_DRIVER: ${{ matrix.driver }}
      GASYNC_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
      GASYNC_MYSQL_USER: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, xml, xmlwriter, pdo_mysql, mysqli, pcntl, posix, sockets, sysvsem, ev, event
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: timeout 60s composer test -- --fail-on-skipped
      - run: |
          for example in fibers callbacks sockets workers; do
            timeout 10s php "examples/$example.php"
          done
  core-without-optional-extensions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, xml, xmlwriter, :ev, :event, :mysqli, :pdo_mysql, :pdo, :posix, :sockets, :sysvsem
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Assert optional extensions are absent
        run: php -r 'foreach (["ev", "event", "mysqli", "pdo_mysql", "PDO", "posix", "sockets", "sysvsem"] as $extension) { if (extension_loaded($extension)) { throw new RuntimeException($extension); } }'
      - run: timeout 60s composer test
